<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aidente 设置 · macOS 风格重排原型</title>
<style>
  :root {
    --window: #f4f5f6;
    --chrome: #f8f8f8;
    --card: #fcfcfc;
    --stroke: rgba(0, 0, 0, 0.09);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #737378;
    --hover: rgba(0, 0, 0, 0.05);
    --sel-bg: rgba(0, 122, 255, 0.80);
    --sel-text: #ffffff;
    --field: #ffffff;
    --search-bg: rgba(0, 0, 0, 0.06);
    /* 侧栏 tab 徽章尺寸：唯一来源。状态文案徽章跟随此值，JS 用 getComputedStyle 读取。 */
    --tab-badge-size: 22px;
    color-scheme: light;
  }
  .dark {
    --window: #232326;
    --chrome: #28282b;
    --card: #2d2d31;
    --stroke: rgba(255, 255, 255, 0.10);
    --stroke-strong: rgba(255, 255, 255, 0.18);
    --text: #f2f2f7;
    --text-2: #98989f;
    --text-3: #96969d;
    --hover: rgba(255, 255, 255, 0.06);
    --sel-bg: rgba(10, 132, 255, 0.80);
    --sel-text: #ffffff;
    --field: #3a3a3e;
    --search-bg: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: #d9dadc;
  }

  /* macOS window shell */
  .window {
    width: 980px; height: 660px; margin: 28px auto;
    background: var(--window);
    border-radius: 12px;
    border: 1px solid var(--stroke-strong);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .titlebar {
    height: 38px; flex: 0 0 38px;
    display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    background: var(--chrome);
    border-bottom: 1px solid var(--stroke);
    position: relative;
  }
  .traffic { width: 12px; height: 12px; border-radius: 50%; }
  .t-r { background: #ff5f57; } .t-y { background: #febc2e; } .t-g { background: #28c840; }
  .titlebar .tt {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--text-2);
    pointer-events: none;
  }
  .theme-toggle {
    margin-left: auto; position: relative; z-index: 2;
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--stroke); background: var(--field); color: var(--text-2);
    cursor: pointer;
  }

  .body { flex: 1; display: flex; min-height: 0; }
  .vdiv { width: 1px; background: var(--stroke); align-self: stretch; }
  .hdiv { height: 1px; background: var(--stroke); margin: 14px 0 18px; }

  /* Sidebar */
  .sidebar {
    width: 236px; flex: 0 0 236px;
    background: var(--chrome);
    display: flex; flex-direction: column;
    padding: 10px 10px 0;
    overflow: hidden;
  }
  .side-head {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px 12px;
  }
  .app-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: #1c2b3a; border: 1px solid var(--stroke);
    display: grid; place-items: center; flex: 0 0 34px;
  }
  .app-badge svg { width: 18px; height: 18px; color: #2ed680; }
  .side-head .name { font-size: 14px; font-weight: 700; }
  .side-head .ver { font-size: 11px; color: var(--text-3); }

  .nav { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .nav::-webkit-scrollbar { width: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; margin: 5px 0; border-radius: 7px;
    cursor: pointer; color: var(--text); font-size: 13px;
    user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--sel-bg); color: var(--sel-text); font-weight: 600; }
  .nav-icon {
    width: var(--tab-badge-size); height: var(--tab-badge-size);
    border-radius: 6px; flex: 0 0 var(--tab-badge-size);
    display: grid; place-items: center;
  }
  .nav-icon svg { width: 14px; height: 14px; color: #fff; }

  /* Detail */
  .detail {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: 26px 30px 40px;
  }
  .detail::-webkit-scrollbar { width: 10px; }
  .detail::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 6px; border: 3px solid var(--window); }
  .page-title { font-size: 20px; font-weight: 700; margin: 0; }
  .page-sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 20px; }

  .cards { max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 16px 16px 6px;
  }
  .card-head { display: flex; align-items: center; gap: 11px; padding-bottom: 14px; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0; }
  .card-sub { font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
  /* 卡头副标题内链：只用系统文字色与副标题灰字区分，不加下划线 */
  .card-sub a { color: var(--text); text-decoration: none; }
  .card-sub a:hover { opacity: .72; }
  .card-divider { height: 1px; background: var(--stroke); margin: 0 -16px 6px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; min-height: 30px;
  }
  .row .r-label { font-size: 13px; flex: 0 0 auto; }
  .row .r-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .row .r-main { flex: 1; min-width: 0; }
  .row .r-control { flex: 0 0 auto; display: flex; align-items: center; }
  .row-text { font-size: 12px; color: var(--text-2); line-height: 1.5; padding: 8px 0 11px; }

  .divider { height: 1px; background: var(--stroke); margin: 0 -16px; }

  /* Toggle */
  /* 开关两态都由 renderCard 传入的卡色决定：
     --toggle-on = 首色实底；--toggle-off = 首色 16% 半透明叠卡片背景 */
  .toggle {
    width: 38px; height: 22px; border-radius: 12px;
    background: var(--toggle-off, #c7c7cc); position: relative; cursor: pointer; transition: background .15s;
    flex: 0 0 38px;
  }
  .toggle.on { background: var(--toggle-on, #3d8ffa); }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .toggle.on::after { transform: translateX(16px); }

  /* Segmented */
  .segmented {
    display: inline-flex; background: var(--search-bg); border-radius: 7px; padding: 2px;
    gap: 2px;
  }
  .seg {
    font-size: 12px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    color: var(--text-2); white-space: nowrap;
  }
  .seg.on { background: var(--field); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  .slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px;
    background: var(--stroke-strong); width: 180px; }
  .slider:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #0a84ff; outline-offset: 2px;
  }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; border: 1px solid var(--stroke-strong);
    box-shadow: 0 1px 2px rgba(0,0,0,.2); cursor: pointer; }
  /* 滑杆数值：13px 常规字重，与行标签同用系统文字色 var(--text)，不随卡色变化 */
  .slider-val { font-size: 13px; color: var(--text); width: 46px; text-align: right; }

  /* Button */
  .btn {
    font-size: 12.5px; padding: 5px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn svg { width: 13px; height: 13px; }
  a.btn { text-decoration: none; }
  .btn-ghost { background: var(--field); border-color: var(--stroke); color: var(--text); }

  /* Notice */
  .notice {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 9px;
    font-size: 11.5px; line-height: 1.45; margin: 6px 0 10px;
    background: var(--search-bg); color: var(--text-2);
  }
  /* 徽章与文字垂直居中；文字换行时由文字块撑高容器，上下等量向外延伸，徽章仍居中 */
  .notice > div { min-width: 0; }

  /* Inset panel */
  .inset {
    background: var(--search-bg); border-radius: 9px; padding: 12px 13px;
    margin: 6px 0 10px; font-size: 12px; color: var(--text-2); line-height: 1.6;
  }
  .inset.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  /* 快捷指令卡：等宽 URL + 灰色中文说明，逐行对齐 */
  .shortcut-line { display: flex; gap: 12px; align-items: baseline; }
  .shortcut-line code { flex: 0 0 210px; color: var(--text); }
  .shortcut-line span { font-family: system-ui; }

  /* 状态文案：卡内说明状态 / 注意事项的独立文字行（.notice） */

  /* 真实组件取色：AidenteIconBadge = 首色 16% 底 / 34% 描边 / 尾色图标 */
  .ib { display: grid; place-items: center; flex: 0 0 auto; box-sizing: border-box; }
  .ib svg { width: var(--ico); height: var(--ico); color: inherit; }
  .notice .ib { flex: 0 0 var(--tab-badge-size); align-self: center; }
  /* 仪表盘 tab：行徽章右缘对齐卡头徽章。固定 28px 槽位（= 卡头徽章宽），徽章右对齐，
     使 26px 行徽章右缘落在 28px 卡头徽章右缘上，行徽章归入卡头徽章组。 */
  .badge-slot { width: 28px; flex: 0 0 28px; display: flex; justify-content: flex-end; align-items: center; }
  .page-head { display: flex; align-items: center; gap: 11px; }
  .page-head .page-sub { margin: 1px 0 0; }

  /* 基线说明（在窗口外的固定浅灰页面背景上：文字变量固定取浅色主题值，
     否则暗色模式下会继承到近白的 --text，落在浅背景上看不清） */
  .legend { max-width: 980px; margin: 0 auto 28px; font-size: 11px;
    color: var(--text-2); line-height: 1.75;
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #737378; }
  .legend b { color: var(--text); }
  .legend code { font-size: 10.5px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
  .sw { display: inline-flex; align-items: center; gap: 5px; }
  .sw i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

  /* 添加计划任务弹窗 · 页下方静态预览（560×590 窗口 mockup） */
  .sheet-wrap { max-width: 720px; margin-top: 20px; }
  .sheet-wrap .sheet-label { font-size: 11px; color: var(--text-3); margin-bottom: 8px; }
  .sheet-window {
    width: 560px; max-width: 100%; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--stroke-strong); background: var(--window);
    box-shadow: 0 10px 34px rgba(0,0,0,.18);
  }
  .sheet-bg { background: var(--window); padding: 24px; }
  .sheet-title { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .sheet-title-t { font-size: 17px; font-weight: 700; margin: 0; }
  .sheet-title-s { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .sheet-actions .btn { padding: 7px 16px; }
  .field {
    font-size: 13px; color: var(--text); background: var(--field);
    border: 1px solid var(--stroke); border-radius: 7px; padding: 5px 10px;
    min-width: 150px; display: inline-block; text-align: left;
  }

  /* 软件更新弹窗 · 只呈现当前状态（页下方静态预览，与「添加计划任务」同款 sheet） */
  .upd-head { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; }
  .upd-title { font-size: 14px; font-weight: 650; color: var(--text); }
  .upd-detail { font-size: 11.5px; color: var(--text-2); margin-top: 3px; line-height: 1.45; }
  .upd-badge { margin-left: auto; flex: 0 0 auto; font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  /* 弹窗状态流转说明（页下方预览区顶部） */
  .sheet-flow { max-width: 720px; margin-top: 20px; padding: 10px 12px;
    border-radius: 9px; background: var(--card); border: 1px solid var(--stroke);
    font-size: 11.5px; color: var(--text-2); line-height: 1.65; }
  .sheet-flow b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic t-r"></div>
      <div class="traffic t-y"></div>
      <div class="traffic t-g"></div>
      <div class="tt">Aidente 设置</div>
      <button class="theme-toggle" id="themeBtn" aria-pressed="false">深色 / 浅色</button>
    </div>
    <div class="body">
      <aside class="sidebar">
        <div class="side-head">
          <div class="app-badge" id="appBadge"></div>
          <div>
            <div class="name">Aidente</div>
          </div>
        </div>
        <nav class="nav" id="nav" role="tablist" aria-label="设置分类"></nav>
      </aside>
      <div class="vdiv"></div>
      <main class="detail" id="detail"></main>
    </div>
  </div>
  <div class="legend" id="legend"></div>

<script>
/* ---------- icon paths (lucide-style) ---------- */
const ICON = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  battery: '<path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3"/><path d="M9 7H8a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><path d="m11 7-3 5h4l-3 5"/><line x1="22" x2="22" y1="11" y2="13"/>',
  calendar: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.25V14"/><path d="M22 16a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z"/>',
  waveform: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',

  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',

  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
  /* sheet 弹窗专用图标（SF Symbol 名 → lucide 线性路径；此前字典缺失导致渲染成色块） */
  'calendar.badge.plus': '<path d="M8 2v4"/><path d="M16 2v4"/><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M3 10h18"/><path d="M19 16v6"/><path d="M22 19h-6"/>',

  'arrow.clockwise.circle.fill': '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',

const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;

/* ---------- palette: 6.1.3 / 8779443 真实色值 ---------- */

/* 2026-11-11 设计规则：卡内徽章三档 —— 28（标题行 / 卡头）、
   26（选项行、Inset）、TAB_BADGE_SIZE（状态文案，始终跟随侧栏 tab，当前 22px）；
   页标题 34 属卡外元素，不受此限。
   尺寸唯一来源是 CSS 变量 --tab-badge-size：侧栏 .nav-icon、状态文案 .notice .ib 与
   iconBadge() 的内联宽高都取它，改一处即同步，不再单独写死数字。
   详情区按元素分两类。
   徽章 = 色对渐变实底、恒定不随主题切换；侧栏 tab 饱和 100%，详情区降到 90%。
   状态文案、动作按钮 = 首色半透明叠在卡片背景 var(--card) 上，跟随主题变化：
   浅色卡片上显淡、深色卡片上随底色变深。文字仍用 var(--text) 等系统语义色。
   例外：状态文案徽章与「添加计划任务」sheet 的行徽章用 legacy 式
   （首色 16% 底 / 34% 描边 / 尾色图标，跟随主题），对应 Swift 的
   legacyStyle: true（AidenteTheme.swift:911 / AutomationSettingsView.swift:120）。 */

/* 侧栏 tab 徽章尺寸：只从 CSS 变量读取；状态文案徽章共用，不写死 22。 */
const TAB_BADGE_SIZE = parseFloat(
  getComputedStyle(document.documentElement).getPropertyValue('--tab-badge-size'));
const pal = k => C[k];
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
/* HSL 饱和度 × factor 等价于向同亮度灰 l 混合 (1-factor)；factor=1 原色。
   侧栏徽章用默认 1，详情区徽章用 BADGE_SATURATION = 0.9。 */
const badgeTint = (hex, factor) => {
  const n = parseInt(hex.slice(1), 16);
  const ch = [n >> 16 & 255, n >> 8 & 255, n & 255];
  const l = (Math.max(...ch) + Math.min(...ch)) / 2;
  return '#' + ch.map(v => Math.round(l + factor * (v - l)).toString(16).padStart(2, '0')).join('');
};
const grad = (k, factor = 1) => {
  const [a, b] = pal(k);
  return `linear-gradient(135deg, ${badgeTint(a, factor)}, ${badgeTint(b, factor)})`;
};

/* 侧栏导航徽章：渐变实底 + 白图标（SettingsView.sidebarRow，真实实现） */
function badge(k, colors) {
  return `<span class="nav-icon" style="background:${grad(colors)}">${svg(k)}</span>`;
}
/* 2026-11-11 规则：详情区徽章绘制对齐侧栏（135° 渐变实底 + 白图标，
   无半透明底 / 描边 / 阴影 / 尾色图标），但色对饱和度降到 90% 且恒定不随主题切换。
   侧栏 tab 徽章保持 100% 饱和。 */
const BADGE_SATURATION = 0.9;
function iconBadge(k, colors, size) {
  const ico = Math.round(size * 0.46);
  return `<span class="ib" style="width:${size}px;height:${size}px;`
    + `border-radius:${Math.max(6, Math.round(size * 0.27))}px;background:${grad(colors, BADGE_SATURATION)};`
    + `color:#fff;--ico:${ico}px">${svg(k)}</span>`;
}
/* 状态文案（AidenteIconBadge 式）徽章：首色 16% 底 / 34% 描边 / 尾色图标，
   半透明叠在卡片背景 var(--card) 上、跟随主题变化（不恒定），带外围框线；
   尺寸跟随 --tab-badge-size。用于「添加计划任务」弹窗任务设置卡的行徽章（用户 2026-11-11 定）。 */
function legacyBadge(k, colors, size = TAB_BADGE_SIZE) {
  const [a, b] = pal(colors);
  const ico = Math.round(size * 0.46);
  return `<span class="ib" style="width:${size}px;height:${size}px;`
    + `border-radius:${Math.max(6, Math.round(size * 0.27))}px;`
    + `background:${rgba(a, .16)};border:1px solid ${rgba(a, .34)};color:${b};--ico:${ico}px">`
    + `${svg(k)}</span>`;
}

/* ---------- 设置页 UI 术语体系（2026-11-11 定） ----------
   卡内元素 = 卡头 / 行徽章 / 开关行 / 状态点 / 状态文案 / 动作按钮 / 数值
              （「同一卡内颜色一致」规则的作用范围，由 renderCard 统一覆盖）
   状态文案 = 卡内说明状态、注意事项的独立文字行：如快捷操作卡「正在以 80% 上限
              管理充电」、通用页「菜单栏实时读数」卡下的「硬件电量通常会与…」
   状态点   = 状态文案前的 8px 圆点
   动作按钮 = 所有按钮与按钮组（代码 AidenteActionButtonStyle）
   以下 rNotice / rBtn / rBtnRow 等 helper 名是实现细节，不重命名。
   colors = 该控件在 6.1.3 基线里真实使用的色对键。
   ---------------------------------------------------------- */
function rToggle(label, sub, on, colors, icon) { return { t:'toggle', label, sub, on, colors, icon }; }
function rSeg(opts, sel, colors, icon) { return { t:'seg', opts, sel, colors, icon }; }
function rControl(label, sub, control, colors, icon) { return { t:'control', label, sub, control, colors, icon }; }
function rSlider(val, min, max, suf) { return { t:'slider', val, min, max, suf }; }
function rStepper(txt) { return { t:'stepper', txt }; }
function rDiv() { return { t:'div' }; }
function rNotice(text, icon, colors) { return { t:'notice', text, icon, colors }; }
function rInset(html, mono) { return { t:'inset', html, mono }; }
function rText(text) { return { t:'text', text }; }
function rBtn(label, colors) { return { t:'btn', label, colors }; }
function rBtnRow(list) { return { t:'btnrow', list }; }
/* 软件更新弹窗专用：状态头 + 线性进度条 + 阶段清单 + 状态文案。
   色对由 renderCard 统一覆盖为弹窗卡色，不另设强调色 / 状态色。 */
function rUpdate(state) { return { t:'update', ...state }; }

/* ---------- render：按真实组件取色 ---------- */
function rowBadge(r, legacy) {
  if (legacy) return legacyBadge(r.icon || 'sliders', r.colors, TAB_BADGE_SIZE);
  return r.colors ? iconBadge(r.icon || 'sliders', r.colors, 26) : '';
}
function renderRow(r, legacy) {
  const b = rowBadge(r, legacy);
  const bOut = b ? `<span class="badge-slot">${b}</span>` : b;
  switch (r.t) {
    case 'toggle': {
      const a = r.colors ? pal(r.colors)[0] : null;
      const tint = a ? ` style="--toggle-on:${a};--toggle-off:${rgba(a, .16)}"` : '';
      return `<div class="row">${bOut}<div class="r-main"><div class="r-label">${r.label}</div>`
        + `${r.sub ? `<div class="r-sub">${r.sub}</div>` : ''}</div>`
        + `<div class="r-control"><div class="toggle ${r.on ? 'on' : ''}"${tint} role="switch" tabindex="0" aria-checked="${r.on ? 'true' : 'false'}" data-toggle></div></div></div>`;
    }
    case 'seg':
      /* Swift 的 Picker(...).labelsHidden()：本行不显示字段名，也不显示行徽章，仅显示选项控件 */
      return `<div class="row"><div class="r-main"></div>`
        + `<div class="r-control"><div class="segmented" role="radiogroup">`
        + `${r.opts.map((o, i) => `<span class="seg ${i === r.sel ? 'on' : ''}" role="radio" aria-checked="${i === r.sel}" tabindex="0" data-seg>${o}</span>`).join('')}`
        + `</div></div></div>`;
    case 'control':
      return `<div class="row">${bOut}<div class="r-main"><div class="r-label">${r.label}</div>`
        + `${r.sub ? `<div class="r-sub">${r.sub}</div>` : ''}</div>`
        + `<div class="r-control">${renderControl(r.control, r.colors, r.label)}</div></div>`;
    case 'div':
      return `<div class="divider"></div>`;
    case 'notice': {
      /* 状态文案徽章 = legacy 式（16% 底 / 34% 描边 / 尾色图标），跟随主题；
         尺寸跟随 --tab-badge-size，与文字垂直居中。对应 Swift AidenteNotice 的 legacyStyle: true。 */
      const [a, b] = pal(r.colors || 'general');
      const ico = Math.round(TAB_BADGE_SIZE * 0.46);
      return `<div class="notice" style="background:${rgba(a, .075)};border:1px solid ${rgba(a, .20)}">`
        + `<span class="ib" style="width:${TAB_BADGE_SIZE}px;height:${TAB_BADGE_SIZE}px;`
        + `border-radius:${Math.max(6, Math.round(TAB_BADGE_SIZE * 0.27))}px;`
        + `background:${rgba(a, .16)};border:1px solid ${rgba(a, .34)};color:${b};--ico:${ico}px">`
        + `${svg(r.icon || 'info')}</span><div>${r.text}</div></div>`;
    }
    case 'inset':
      return `<div class="inset ${r.mono ? 'mono' : ''}">${r.html}</div>`;
    case 'update': {
      const [a] = pal(r.colors || 'permissions');
      const badge = r.badge
        ? `<span class="upd-badge" style="background:${rgba(a, .12)};color:${a}">${r.badge}</span>`
        : '';
      /* 2026-11-14：弹窗只呈现当前状态（图标 + 标题 + 一句说明 + 版本胶囊），
         不展示更新过程的阶段清单 / 进度条，也不展示独立的状态文案行。 */
      return `<div class="upd"><div class="upd-head">`
        + `${iconBadge(r.icon || 'download', r.colors, 28)}`
        + `<div><div class="upd-title">${r.title}</div>`
        + `<div class="upd-detail">${r.detail}</div></div>${badge}</div></div>`;
    }
    case 'text':
      return `<div class="row-text">${r.text}</div>`;
    case 'btn': {
      const a = pal(r.colors || 'general')[0];
      return `<div style="padding:6px 0 12px"><span class="btn" style="background:${rgba(a, .20)};`
        + `border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${svg('bolt')}${r.label}</span></div>`;
    }
    case 'btnrow':
      return `<div style="display:flex;gap:10px;padding:6px 0 12px">`
        + r.list.map(([l, c, href]) => {
          const a = pal(c || 'general')[0];
          const style = `background:${rgba(a, .20)};border-color:${rgba(a, .34)};color:var(--text)`;
          const inner = `${svg('bolt')}${l}`;
          /* 有 href 时渲染成真链接（新标签打开），否则沿用静态按钮占位 */
          if (href) return `<a class="btn" href="${href}" target="_blank" rel="noopener noreferrer" style="${style}">${inner}</a>`;
          return `<span class="btn" style="${style}" role="button" tabindex="0">${inner}</span>`;
        }).join('') + `</div>`;
  }
  return '';
}
function renderControl(c, colors, label) {
  if (c.t === 'picker' || c.t === 'date') {
    const caret = c.t === 'picker' ? ' <span style="opacity:.45;font-size:11px">▾</span>' : '';
    return `<span class="field">${c.val}${caret}</span>`;
  }
  if (c.t === 'slider') {
    return `<div class="slider-wrap"><input class="slider" type="range" min="${c.min}" max="${c.max}"`
      + ` value="${c.val}" aria-label="${label || '数值'}">`
      + `<span class="slider-val">${c.val}${c.suf}</span></div>`;
  }
  if (c.t === 'stepper') return `<span style="font-size:13px;color:var(--text)">${c.txt}</span>`;
  if (c.t === 'button') {
    const a = colors ? pal(colors)[0] : '#5856d6';
    /* 行右侧内联按钮默认无图标（「开始电池校准」保持原样）；需要时由 control.icon 指定，
       与 rBtn / rBtnRow / card.action 的动作按钮同款图标。 */
    const ico = c.icon ? svg(c.icon) : '';
    return `<span class="btn" style="background:${rgba(a, .20)};border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${ico}${c.label}</span>`;
  }
  return '';
}

/* 2026-11-11 设计规则：同一张卡片内颜色一致，不设强调色 / 状态色例外。
   卡头选定色对后，卡内行徽章、开关行、状态点、状态文案、动作按钮、数值一律继承；
   其中徽章为恒定实底，状态文案与动作按钮按半透明档位跟随主题变化。
   PAGES 里各控件原有的 colors 值保留作 6.1.3 基线追溯，渲染时统一覆盖。 */
function renderCard(card, legacyRows) {
  const rows = card.rows.map(r => {
    const row = { ...r, colors: card.colors };
    /* 第三项 href 保留：链接型动作按钮用 <a>，其余仍是静态 <span> */
    if (r.t === 'btnrow') row.list = r.list.map(([label, , href]) => [label, card.colors, href]);
    return row;
  });
  /* 2026-11-14 破例：card.action 把动作按钮放到卡头标题右侧，色对继承卡色，
     与卡内动作按钮同档（20% 底 / 34% 描边、文字系统色、随主题）。 */
  const [a] = pal(card.colors);
  /* 2026-11-14：软件更新 sheet 的卡片不设卡头——弹窗标题区已说明用途，
     「更新检查 / 更新进度」这行重复。headless 跳过徽章、标题、副标题与分隔线。 */
  const headless = !!card.headless;
  const headAction = !headless && card.action
    ? `<span class="btn" style="margin-left:auto;flex:0 0 auto;background:${rgba(a, .20)};`
      + `border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${svg('bolt')}${card.action}</span>`
    : '';
  const header = headless ? '' : `<div class="card-head">
      ${iconBadge(card.icon, card.colors, 28)}
      <div style="flex:1;min-width:0"><h2 class="card-title">${card.title}</h2>${card.sub ? `<div class="card-sub">${card.sub}</div>` : ''}</div>
      ${headAction}
    </div>
    ${rows.length ? '<div class="card-divider"></div>' : ''}`;
  return `<div class="card">${header}
    ${rows.map(r => renderRow(r, legacyRows)).join('')}
  </div>`;
}

/* 弹窗（sheet）静态预览：标题区 + 卡片 + 底部动作按钮。
   sheet 标题徽章 34 属卡外元素，与页标题同档（AutomationSettingsView.swift:92-101 同为 34）。
   「添加计划任务」沿用 legacy 行徽章；「软件更新」用 constant 实底徽章（legacyRows:false）。
   label / actions 可选；不传时保持「添加计划任务」弹窗的原样。 */
function renderSheet(sheet) {
  const [a] = pal(sheet.colors);
  const actions = sheet.actions || [
    { label:'取消', ghost:true },
    { label:'添加任务' },
  ];
  const buttons = actions.map(act => act.ghost
    ? `<span class="btn btn-ghost" role="button" tabindex="0">${act.label}</span>`
    : `<span class="btn" style="background:${rgba(a, .20)};border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${act.label}</span>`
  ).join('');
  return `<div class="sheet-window"><div class="sheet-bg">`
    + `<div class="sheet-title">${iconBadge(sheet.icon, sheet.colors, 34)}`
    + `<div><h2 class="sheet-title-t">${sheet.title}</h2>`
    + `<div class="sheet-title-s">${sheet.sub}</div></div></div>`
    + renderCard(sheet.card, sheet.legacyRows !== false)
    + `<div class="sheet-actions">${buttons}</div></div></div>`;
}

/* 一个页可预览多个弹窗状态（软件更新的检查 / 结果 / 进度 / 完成 / 失败）；
   单对象仍是「添加计划任务」。flow 是可选的状态流转说明，放在最前。 */
function renderSheetPreviews(sheets, flow) {
  const list = Array.isArray(sheets) ? sheets : [sheets];
  const flowBlock = flow ? `<div class="sheet-flow"><b>弹窗状态流转</b><br>${flow}</div>` : '';
  return flowBlock + list.map(s => `<div class="sheet-wrap"><div class="sheet-label">${
    s.label || '添加计划任务弹窗（点「添加计划任务」后弹出 · 560×590）'
  }</div>${renderSheet(s)}</div>`).join('');
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map((t, i) => {
    return `<div class="nav-item ${i===0?'active':''}" role="tab" tabindex="0" aria-selected="${i===0}" data-tab="${t.id}">${badge(t.icon, t.colors)}<span>${t.title}</span></div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => selectTab(el.dataset.tab));
  });
}

let currentTab = 'general';
function selectTab(id) {
  currentTab = id;
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = el.dataset.tab === id;
    el.classList.toggle('active', on);
    el.setAttribute('aria-selected', String(on));
  });
  const page = PAGES[id];
  const tab = TABS.find(t => t.id === id);
  const detail = document.getElementById('detail');
  detail.innerHTML = `<div class="page-head">${iconBadge(tab.icon, tab.colors, 34)}`
    + `<div><h1 class="page-title">${tab.title}</h1><div class="page-sub">${page.sub}</div></div></div>`
    + `<div class="hdiv"></div><div class="cards">${page.cards.map(c => renderCard(c, false)).join('')}</div>`
    + (page.sheet ? renderSheetPreviews(page.sheet, page.sheetFlow) : '');
  bindInteractions();
}

function bindInteractions() {
  // 非原生控件统一支持 Enter / Space 激活
  document.querySelectorAll('[tabindex]:not(input):not(button)').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });
  // toggles
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('on');
      el.setAttribute('aria-checked', String(el.classList.contains('on')));
    });
  });
  // segmented
  document.querySelectorAll('.segmented').forEach(group => {
    group.querySelectorAll('[data-seg]').forEach(seg => {
      seg.addEventListener('click', () => {
        group.querySelectorAll('[data-seg]').forEach(s => {
          s.classList.remove('on'); s.setAttribute('aria-checked', 'false');
        });
        seg.classList.add('on'); seg.setAttribute('aria-checked', 'true');
      });
    });
  });
  // sliders value label
  document.querySelectorAll('.slider').forEach(s => {
    s.addEventListener('input', () => {
      const v = s.parentElement.querySelector('.slider-val');
      if (v) v.textContent = s.value + (v.textContent.replace(/[0-9]/g,''));
    });
  });
}

/* ---------- theme toggle ---------- */
const themeBtn = document.getElementById('themeBtn');
themeBtn.setAttribute('aria-pressed', 'false');
themeBtn.addEventListener('click', () => {
  const dark = document.body.classList.toggle('dark');
  themeBtn.setAttribute('aria-pressed', String(dark));
});
document.getElementById('appBadge').innerHTML = svg('bolt');

/* ---------- 规则说明 ---------- */
function renderLegend() {
  /* 按标签映射当前实际色对 */
  const legendPairs = [
    ['general', '通用'], ['dashboard', '仪表盘'], ['charging', '充电管理'],
    ['advanced', '睡眠管理'], ['automation', '自动化'], ['about', '诊断'],
    ['permissions', '关于'], ['heat', '高温保护（字面量）'],
  ];
  const sw = legendPairs.map(([k, label]) =>
    `<span class="sw"><i style="background:linear-gradient(135deg,${pal(k)[0]},${pal(k)[1]})"></i>${label}</span>`
  ).join('');
  document.getElementById('legend').innerHTML =
    `<b>配色规则</b>`
    + `<br>· 卡内同色：每张卡由卡头选定色对，行徽章、开关行、状态点、状态文案、动作按钮、数值全部继承，无强调色例外；相邻卡允许同色 / 相近色。`
    + `<br>· 徽章恒定：色对 135° 渐变实底 + 白图标，不随主题切换；侧栏 tab 饱和 100%，详情区徽章同款绘制但饱和 90%。例外：状态文案徽章与「添加计划任务」sheet 行徽章为 legacy 式（首色 16% 底 / 34% 描边 / 尾色图标，跟随主题），对应 Swift 的 legacyStyle: true。`
    + `<br>· 跟随主题的部分：开关开态 = 首色实底、关态 = 首色 16% 半透明；动作按钮 = 首色 20% 底 / 34% 描边；状态文案 = 首色 7.5% 底 / 20% 描边——三者叠在卡背景上随主题变。滑杆数值用系统文字色 var(--text)，与行标签一致，不随卡色变化。`
    + `<br>· 徽章尺寸：状态文案 = 侧栏 tab（引用唯一来源 <code>--tab-badge-size</code>）、行 / Inset <code>26</code>、卡头 <code>28</code>、页标题与 sheet 标题 <code>34</code>；状态文案的徽章与文字垂直居中，换行时容器上下等量延伸。`
    + `<br><b>术语</b>：侧栏 tab（左边栏）；页标题（右边栏）；卡片 = 卡头（徽章 + 标题）、行 / Inset、卡内元素；状态文案 = 卡内说明状态的文字行；状态点 = 其前圆点；动作按钮 = 所有按钮；toggle（开关）。`
    + `<div class="swatches">${sw}</div>`;
}

/* ---------- init ---------- */
renderNav();
selectTab('general');
renderLegend();
</script>
