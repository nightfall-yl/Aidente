<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aidente 设置 · macOS 风格重排原型</title>
<style>
  :root {
    --window: #f4f5f6;
    --chrome: #f8f8f8;
    --card: #fcfcfc;
    --stroke: rgba(0, 0, 0, 0.09);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #8e8e93;
    --hover: rgba(0, 0, 0, 0.05);
    --sel-bg: rgba(0, 122, 255, 0.80);
    --sel-text: #ffffff;
    --field: #ffffff;
    --jade: #2ed680;
    --accent: #2ed680;
    --search-bg: rgba(0, 0, 0, 0.06);
    --shadow: none;
    color-scheme: light;
  }
  .dark {
    --window: #232326;
    --chrome: #28282b;
    --card: #2d2d31;
    --stroke: rgba(255, 255, 255, 0.10);
    --stroke-strong: rgba(255, 255, 255, 0.18);
    --text: #f2f2f7;
    --text-2: #98989f;
    --text-3: #76767b;
    --hover: rgba(255, 255, 255, 0.06);
    --sel-bg: rgba(10, 132, 255, 0.80);
    --sel-text: #ffffff;
    --field: #3a3a3e;
    --jade: #2ed680;
    --accent: #2ed680;
    --search-bg: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: #d9dadc;
  }

  /* macOS window shell */
  .window {
    width: 980px; height: 660px; margin: 28px auto;
    background: var(--window);
    border-radius: 12px;
    border: 1px solid var(--stroke-strong);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .titlebar {
    height: 38px; flex: 0 0 38px;
    display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    background: var(--chrome);
    border-bottom: 1px solid var(--stroke);
    position: relative;
  }
  .traffic { width: 12px; height: 12px; border-radius: 50%; }
  .t-r { background: #ff5f57; } .t-y { background: #febc2e; } .t-g { background: #28c840; }
  .titlebar .tt {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--text-2);
    pointer-events: none;
  }
  .theme-toggle {
    margin-left: auto; position: relative; z-index: 2;
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--stroke); background: var(--field); color: var(--text-2);
    cursor: pointer;
  }

  .body { flex: 1; display: flex; min-height: 0; }
  .vdiv { width: 1px; background: var(--stroke); align-self: stretch; }
  .hdiv { height: 1px; background: var(--stroke); margin: 14px 0 18px; }

  /* Sidebar */
  .sidebar {
    width: 236px; flex: 0 0 236px;
    background: var(--chrome);
    display: flex; flex-direction: column;
    padding: 10px 10px 0;
    overflow: hidden;
  }
  .side-head {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px 12px;
  }
  .app-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--jade), #66ebad);
    display: grid; place-items: center; flex: 0 0 34px;
  }
  .app-badge svg { width: 18px; height: 18px; color: #0c3d27; }
  .side-head .name { font-size: 14px; font-weight: 700; }
  .side-head .ver { font-size: 11px; color: var(--text-3); }

  .nav { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .nav::-webkit-scrollbar { width: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; margin: 5px 0; border-radius: 7px;
    cursor: pointer; color: var(--text); font-size: 13px;
    user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--sel-bg); color: var(--sel-text); font-weight: 600; }
  .nav-icon {
    width: 22px; height: 22px; border-radius: 6px; flex: 0 0 22px;
    display: grid; place-items: center;
  }
  .nav-icon svg { width: 14px; height: 14px; color: #fff; }

  /* Detail */
  .detail {
    flex: 1; min-width: 0; overflow-y: auto;
    padding: 26px 30px 40px;
  }
  .detail::-webkit-scrollbar { width: 10px; }
  .detail::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 6px; border: 3px solid var(--window); }
  .page-title {
    font-size: 22px; font-weight: 700; margin: 0 0 2px;
  }
  .page-sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 20px; }

  .cards { max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 16px 16px 6px;
  }
  .card-head { display: flex; align-items: center; gap: 11px; padding-bottom: 14px; }
  .card-icon {
    width: 32px; height: 32px; border-radius: 8px; flex: 0 0 32px;
    display: grid; place-items: center;
  }
  .card-icon svg { width: 18px; height: 18px; color: #fff; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-sub { font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
  .card-divider { height: 1px; background: var(--stroke); margin: 0 -16px 6px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; min-height: 30px;
  }
  .row .r-label { font-size: 13px; flex: 0 0 auto; }
  .row .r-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .row .r-main { flex: 1; min-width: 0; }
  .row .r-control { flex: 0 0 auto; display: flex; align-items: center; }
  .row-stack .r-main { flex: 1; }
  .row-text { font-size: 12px; color: var(--text-2); line-height: 1.5; padding: 8px 0 11px; }

  .divider { height: 1px; background: var(--stroke); margin: 0 -16px; }

  /* Toggle */
  .toggle {
    width: 38px; height: 22px; border-radius: 12px;
    background: #c7c7cc; position: relative; cursor: pointer; transition: background .15s;
    flex: 0 0 38px;
  }
  .dark .toggle { background: #4a4a4e; }
  .toggle.on { background: #3d8ffa; }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .toggle.on::after { transform: translateX(16px); }

  /* Segmented */
  .segmented {
    display: inline-flex; background: var(--search-bg); border-radius: 7px; padding: 2px;
    gap: 2px;
  }
  .seg {
    font-size: 12px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    color: var(--text-2); white-space: nowrap;
  }
  .seg.on { background: var(--field); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  .slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px;
    background: var(--stroke-strong); width: 180px; outline: none; }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; border: 1px solid var(--stroke-strong);
    box-shadow: 0 1px 2px rgba(0,0,0,.2); cursor: pointer; }
  .slider-val { font-size: 13px; font-weight: 600; color: var(--accent); width: 46px; text-align: right; }

  /* Button */
  .btn {
    font-size: 12.5px; padding: 5px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn svg { width: 13px; height: 13px; }
  .btn-primary { background: var(--accent); color: #0c3d27; }
  .btn-ghost { background: var(--field); border-color: var(--stroke); color: var(--text); }

  /* Notice */
  .notice {
    display: flex; gap: 9px; padding: 10px 12px; border-radius: 9px;
    font-size: 11.5px; line-height: 1.45; margin: 6px 0 10px;
    background: var(--search-bg); color: var(--text-2);
  }
  .notice svg { width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px; }

  /* Inset panel */
  .inset {
    background: var(--search-bg); border-radius: 9px; padding: 12px 13px;
    margin: 6px 0 10px; font-size: 12px; color: var(--text-2); line-height: 1.6;
  }
  .inset.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }

  .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); flex: 0 0 8px; }
  .status-line { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .pill { font-size: 10.5px; font-weight: 700; color: var(--accent); background: rgba(46,214,128,.14);
    padding: 3px 8px; border-radius: 20px; }

  .hint { font-size: 10.5px; color: var(--text-3); }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic t-r"></div>
      <div class="traffic t-y"></div>
      <div class="traffic t-g"></div>
      <div class="tt">Aidente 设置</div>
      <button class="theme-toggle" id="themeBtn">深色 / 浅色</button>
    </div>
    <div class="body">
      <aside class="sidebar">
        <div class="side-head">
          <div class="app-badge" id="appBadge"></div>
          <div>
            <div class="name">Aidente</div>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
      </aside>
      <div class="vdiv"></div>
      <main class="detail" id="detail"></main>
    </div>
  </div>

<script>
/* ---------- icon paths (lucide-style) ---------- */
const ICON = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',

  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',

const svg = (k, cls) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]||''}</svg>`;

  general:    ['#3d8ffa', '#5cbdff'],
  dashboard:  ['#8c6bfa', '#e661db'],
  charging:   ['#2ed680', '#66ebad'],
  automation: ['#ff972e', '#ffc245'],
  diagnostics:['#8c6bfa', '#e661db'],
  about:      ['#fa574d', '#ff972e'],
};
const grad = (k) => `linear-gradient(135deg, ${C[k][0]}, ${C[k][1]})`;

/* ---------- icon badge helper ---------- */
function badge(k, colors, size) {
  return `<span class="nav-icon" style="background:${grad(colors)}">${svg(k)}</span>`;
}

/* ---------- data: tabs + cards ---------- */

  { id:'permissions',title:'权限管理',    icon:'shield',    colors:'general' },

  { id:'diagnostics',title:'诊断',        icon:'waveform',  colors:'diagnostics' },
  { id:'about',     title:'关于',         icon:'heart',     colors:'about', sep:true },

const PAGES = {

    sub: '语言、外观、启动与通知等全局基础偏好。',

      ]},
      { title:'启动', sub:'让电池保护在登录后自动开始工作。', icon:'power', colors:'general', rows:[

        rDiv(),
        rToggle('使用颜色显示电池状态', '充电、接通电源、低电量使用不同颜色。', true, 'dashboard'),

      { title:'通知', sub:'控制 Aidente 何时向你报告充电状态。', icon:'bell', colors:'automation', rows:[

  },

        rDiv(),
        rToggle('睡眠时暂停充电', '', true, 'general'),

      { title:'电池校准', sub:'充至 100% → 放电 → 再充满 → 满电保持 → 恢复原上限。', icon:'gauge', colors:'dashboard', rows:[

      { title:'巡航模式', sub:'允许电量在上限附近自然浮动，减少频繁微量补电。', icon:'signal', colors:'general', rows:[

/* ---------- row renderers ---------- */
function rToggle(label, sub, on, colors) {
  return { t:'toggle', label, sub, on, colors };
}
function rSeg(opts, sel) { return { t:'seg', opts, sel }; }
function rControl(label, sub, control) { return { t:'control', label, sub, control }; }
function rSlider(val, min, max, suf) { return { t:'slider', val, min, max, suf }; }
function rStepper(txt) { return { t:'stepper', txt }; }
function rDiv() { return { t:'div' }; }
function rNotice(text, icon, colors) { return { t:'notice', text, icon, colors }; }
function rInset(html, mono) { return { t:'inset', html, mono }; }
function rText(text) { return { t:'text', text }; }
function rBtn(label, kind, colors) { return { t:'btn', label, kind, colors }; }
function rBtnRow(list) { return { t:'btnrow', list }; }

/* ---------- render ---------- */
function renderRow(r) {
  switch (r.t) {
    case 'toggle':
      return `<div class="row"><div class="r-main"><div class="r-label">${r.label}</div>${r.sub?`<div class="r-sub">${r.sub}</div>`:''}</div><div class="r-control"><div class="toggle ${r.on?'on':''}" data-toggle></div></div></div>`;
    case 'seg':
      return `<div class="row"><div class="r-main"><div class="r-label">${r.opts[0]}</div></div><div class="r-control"><div class="segmented">${r.opts.map((o,i)=>`<span class="seg ${i===r.sel?'on':''}" data-seg>${o}</span>`).join('')}</div></div></div>`;
    case 'control':
      return `<div class="row"><div class="r-main"><div class="r-label">${r.label}</div>${r.sub?`<div class="r-sub">${r.sub}</div>`:''}</div><div class="r-control">${renderControl(r.control)}</div></div>`;
    case 'slider':
      return `<div class="slider-wrap"><input class="slider" type="range" min="${r.min}" max="${r.max}" value="${r.val}"><span class="slider-val">${r.val}${r.suf}</span></div>`;
    case 'stepper':
      return `<span style="font-size:13px;color:var(--text)">${r.txt}</span>`;
    case 'div':
      return `<div class="divider"></div>`;
    case 'notice':
      return `<div class="notice">${svg(r.icon)}<div>${r.text}</div></div>`;
    case 'inset':
      return `<div class="inset ${r.mono?'mono':''}">${r.html}</div>`;
    case 'text':
      return `<div class="row-text">${r.text}</div>`;
    case 'btn':
      return `<div style="padding:6px 0 12px"><span class="btn btn-${r.kind}">${svg('bolt')}${r.label}</span></div>`;
    case 'btnrow':
      return `<div style="display:flex;gap:10px;padding:6px 0 12px">${r.list.map(([l,k,c])=>`<span class="btn btn-${k}">${svg('bolt')}${l}</span>`).join('')}</div>`;
  }
  return '';
}
function renderControl(c) {
  if (c.t === 'slider') {
    return `<div class="slider-wrap"><input class="slider" type="range" min="${c.min}" max="${c.max}" value="${c.val}"><span class="slider-val">${c.val}${c.suf}</span></div>`;
  }
  if (c.t === 'stepper') return `<span style="font-size:13px;color:var(--text)">${c.txt}</span>`;
  return '';
}

function renderCard(card) {
  return `<div class="card">
    <div class="card-head">
      <span class="card-icon" style="background:${grad(card.colors)}">${svg(card.icon)}</span>
      <div><div class="card-title">${card.title}</div>${card.sub?`<div class="card-sub">${card.sub}</div>`:''}</div>
    </div>
    ${card.rows.length ? '<div class="card-divider"></div>' : ''}
    ${card.rows.map(renderRow).join('')}
  </div>`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map((t, i) => {
    return `<div class="nav-item ${i===0?'active':''}" data-tab="${t.id}">${badge(t.icon, t.colors)}<span>${t.title}</span></div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => selectTab(el.dataset.tab));
  });
}

function selectTab(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
  const page = PAGES[id];
  const tab = TABS.find(t => t.id === id);
  const detail = document.getElementById('detail');
  detail.innerHTML = `<div class="page-title">${tab.title}</div><div class="page-sub">${page.sub}</div><div class="hdiv"></div><div class="cards">${page.cards.map(renderCard).join('')}</div>`;
  bindInteractions();
}

function bindInteractions() {
  // toggles
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('on'));
  });
  // segmented
  document.querySelectorAll('.segmented').forEach(group => {
    group.querySelectorAll('[data-seg]').forEach(seg => {
      seg.addEventListener('click', () => {
        group.querySelectorAll('[data-seg]').forEach(s => s.classList.remove('on'));
        seg.classList.add('on');
      });
    });
  });
  // sliders value label
  document.querySelectorAll('.slider').forEach(s => {
    s.addEventListener('input', () => {
      const v = s.parentElement.querySelector('.slider-val');
      if (v) v.textContent = s.value + (v.textContent.replace(/[0-9]/g,''));
    });
  });
}

/* ---------- theme toggle ---------- */
document.getElementById('themeBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark');
});
document.getElementById('appBadge').innerHTML = svg('bolt');

/* ---------- init ---------- */
renderNav();
selectTab('general');
</script>
