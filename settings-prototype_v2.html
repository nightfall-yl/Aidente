<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aidente 设置 · macOS 风格重排原型</title>
<style>
  :root {
    --window: #f7f8fa;                          /* 内容区：最浅 */
    --detail-pane: #edeef0;                     /* 右栏专用底色（对齐 Swift detailPaneColor 浅 #EDEEF0，略偏灰不过白） */
    --chrome: #ececee;                          /* 侧栏：比内容区深 */
    --card: #f5f5f7;                            /* 卡片：浅灰白，对齐 Swift settingsCardColor，避免右栏灰底上过白 */
    --stroke: rgba(0, 0, 0, 0.09);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #737378;
    --hover: rgba(0, 0, 0, 0.05);
    --sel-bg: rgba(0, 122, 255, 0.80);
    --nav-icon-on: #535353;                     /* 页头前进/后退可用图标：炭灰（macOS 截图采样），非蓝色 */
    --sel-text: #ffffff;
    --field: #ffffff;
    --search-bg: rgba(0, 0, 0, 0.06);
    /* 导航栏 tab 徽章尺寸：唯一来源。状态文案徽章跟随此值，JS 用 getComputedStyle 读取。 */
    --tab-badge-size: 22px;
    /* 设置页玻璃化原型变量（对齐 Swift AidenteSurfaceTokens / AidenteReadability） */
    --side-fill: rgba(236, 236, 238, .60);      /* 侧栏玻璃材质（比内容区深） */
    --l0-tint: rgba(255, 255, 255, 0);          /* 浅色 glassTint = .clear */
    --desk-a: #6ea8ff; --desk-b: #b18cff; --desk-c: #ffd9a8;
    --blob1: rgba(120, 180, 255, .62);
    --blob2: rgba(190, 140, 255, .52);
    --blob3: rgba(255, 190, 130, .58);
    color-scheme: light;
  }
  .dark {
    --window: #2c2c2f;                          /* 内容区：稍浅深灰 */
    --detail-pane: #2c2c2f;                     /* 右栏专用底色：深色沿用 .window token */
    --chrome: #262629;                          /* 侧栏：深灰，比内容区深一档但不贴黑 */
    --card: #363639;                            /* 卡片：比内容区再浅一档 */
    --stroke: rgba(255, 255, 255, 0.10);
    --stroke-strong: rgba(255, 255, 255, 0.18);
    --window-ring: rgba(255, 255, 255, 0.20);   /* 深色窗口光圈：对齐 Swift 白 20% 内描边 */
    --text: #f2f2f7;
    --text-2: #98989f;
    --text-3: #96969d;
    --hover: rgba(255, 255, 255, 0.06);
    --sel-bg: rgba(10, 132, 255, 0.80);
    --nav-icon-on: #F2F2F7;                     /* 深色可用图标：浅灰（与深色文字同源） */
    --sel-text: #ffffff;
    --field: #3a3a3e;
    --search-bg: rgba(255, 255, 255, 0.08);
    --side-fill: rgba(52, 52, 56, .50);         /* 侧栏玻璃材质（提亮，比内容区深一档） */
    --l0-tint: rgba(30, 30, 34, .24);           /* 深色 glassTint = rgb(30,30,34) .24 */
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
      "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text);
  }
  /* 玻璃需要一个"身后"：模拟桌面壁纸，设置窗口的 L0 会采样它。
     切到纯色壁纸可单独看玻璃的提亮与描边。 */
  body {
    background:
      radial-gradient(420px 340px at 12% 18%, var(--blob1), transparent 70%),
      radial-gradient(460px 360px at 82% 26%, var(--blob2), transparent 70%),
      radial-gradient(520px 380px at 62% 92%, var(--blob3), transparent 70%),
      linear-gradient(135deg, var(--desk-a), var(--desk-b) 52%, var(--desk-c));
    background-attachment: fixed;
  }
  body[data-desktop="plain"] { background: #d9dadc; }

  /* 原型控制条：只在 HTML 原型里对照，不参与 App 实现 */
  .proto-bar {
    max-width: 980px; margin: 18px auto 0;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 9px 14px; border-radius: 12px;
    background: rgba(255,255,255,.76); border: 1px solid rgba(0,0,0,.10);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 11.5px; color: #1d1d1f;
  }
  .dark .proto-bar {
    background: rgba(44,44,48,.76); border-color: rgba(255,255,255,.14); color: #f2f2f7;
  }
  .proto-bar b { font-size: 12px; }
  .proto-bar .grp { display: inline-flex; align-items: center; gap: 6px; }
  .proto-bar .grp + .grp { padding-left: 12px; border-left: 1px solid rgba(127,127,127,.32); }
  .proto-bar button {
    font: inherit; font-size: 11px; padding: 3px 9px; border-radius: 6px;
    border: 1px solid rgba(127,127,127,.4); background: transparent; color: inherit; cursor: pointer;
  }
  .proto-bar button.on { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  .proto-bar button:disabled { opacity: .4; cursor: default; }
  .proto-bar input[type=range] { width: 108px; accent-color: #0a84ff; }
  .proto-bar .val { font-variant-numeric: tabular-nums; min-width: 30px; }
  .proto-bar .hint { opacity: .72; }

  /* macOS window shell */
  .window {
    width: 750px; height: 660px; margin: 28px auto;
    background: var(--window);
    border-radius: 12px;
    border: 1px solid var(--stroke-strong, rgba(0, 0, 0, 0.14));
    /* 深色模式窗口光圈（2026-11-17）：1pt 白 14% 描边，对齐 Swift SettingsView
       根部 overlay 的 strokeBorder；浅色无光圈（保留系统自带边缘高光）。 */
    border-color: var(--window-ring, var(--stroke-strong));
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  /* 玻璃下沉到侧栏：右栏恒实色（降低透明度恒开），左栏由 data-glass 控制（降低透明度恒关）。
     实色/玻璃开关只作用于左栏侧栏，不动右栏内容区。 */
  body[data-glass="on"] .sidebar {
    background: linear-gradient(var(--l0-tint), var(--l0-tint)), var(--side-fill);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
  }
  body[data-glass="off"] .sidebar { background: var(--chrome); }
  /* macOS 15 框架：没有横贯的标题栏。交通灯浮在侧栏左上角，
     左右分栏从窗口最顶部贯通到底，竖线全程可见。
     交通灯 / 主徽章几何对齐 Swift 已落地值（pt 与 px 1:1）：
     交通灯中心 y=30、左缘 x=20；徽章左缘 x=16、徽章 + 文字中心线 y=77（交通灯下方 47）。
     交通灯走绝对定位、不占布局流，对应 AppKit 浮动按钮；主徽章从窗口顶部按 Swift
     的 header 规格起排（padding.top 54 / 帧高 46 / padding.horizontal 16）。 */
  .traffic { width: 12px; height: 12px; border-radius: 50%; }
  .t-r { background: #ff5f57; } .t-y { background: #febc2e; } .t-g { background: #28c840; }
  .side-traffic {
    position: absolute; top: 0; left: 0; right: 0;
    height: 60px; padding-left: 20px;            /* 中心 y=30，最左缘 x=20 */
    display: flex; align-items: center; gap: 8px;
    pointer-events: none; z-index: 2;
  }

  .body { flex: 1; display: flex; min-height: 0; }
  .vdiv { width: 1px; background: var(--stroke); align-self: stretch; }
  .hdiv { height: 1px; background: var(--stroke); margin: 14px 0 18px; }

  /* Sidebar */
  .sidebar {
    width: 214px; flex: 0 0 214px;
    background: var(--chrome);
    display: flex; flex-direction: column;
    position: relative;   /* 交通灯绝对定位的基准 */
    padding: 0;           /* 由各子元素各自控制，便于对齐 Swift 数值 */
    overflow: hidden;
  }
  .side-head {
    margin: 54px 0 12px;  /* Swift header padding.top 54 / bottom 12 */
    height: 46px;         /* Swift headerContentHeight 46，徽章垂直居中 → 中心 y=77（交通灯下方 47） */
    padding: 0 16px;      /* Swift padding.horizontal 16 → 徽章左缘 x=16 */
    display: flex; align-items: center; gap: 11px;
  }
  .app-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: #1c2b3a; border: 1px solid var(--stroke);
    display: grid; place-items: center; flex: 0 0 34px;
  }
  .app-badge svg { width: 18px; height: 18px; color: #2ed680; }
  .side-head .name { font-size: 18px; font-weight: 700; }  /* Swift 18pt bold */
  .side-head .ver { font-size: 11px; color: var(--text-3); }

  .nav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }  /* 左右 10 补偿原 sidebar padding，导航项视觉位置不变 */
  .nav::-webkit-scrollbar { width: 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px; margin: 5px 0; border-radius: 7px;
    cursor: pointer; color: var(--text); font-size: 13px;
    user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--sel-bg); color: var(--sel-text); font-weight: 600; }
  .nav-icon {
    width: var(--tab-badge-size); height: var(--tab-badge-size);
    border-radius: 6px; flex: 0 0 var(--tab-badge-size);
    display: grid; place-items: center;
  }
  .nav-icon svg { width: 14px; height: 14px; color: #fff; }

  /* Detail：右栏拆成「固定页头」+「滚动内容」两块。
     右栏降低透明度恒开 → 永远实色，不采样玻璃，底色用右栏专用 --detail-pane。 */
  .detail {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--detail-pane);
  }
  /* 固定页头：纯页标题（无徽章 / 副标题）+ 底部横线，不参与滚动。
     实色背景 + 高层级 → 滚动的卡片从它下方穿过、被它遮住。整块可拖动窗口。
     几何对齐 Swift（pt↔px 1:1）：标题槽高 60 → 文字中心 y=30；
     横线紧跟槽底 y=60（距文字中心 30）；标题与横线左右各缩进 20。 */
  .detail-head {
    flex: 0 0 auto;
    padding: 0;
    background: var(--detail-pane);
    position: relative; z-index: 2;
  }
  .detail-head .page-head {
    height: 60px;                 /* Swift frame(height: 60) → 文字中心 y=30 */
    display: flex; align-items: center;
    padding: 0 20px;              /* Swift .padding(.horizontal, 20) */
  }
  .detail-head .hdiv { margin: 0 20px; }  /* Swift Divider().padding(.horizontal, 20)，y=60 */
  /* 滚动区：只有卡片与 sheet 预览在这里滚。原横线下方 18px 间距移到此处的 padding-top。 */
  .detail-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 18px 30px 40px;
  }
  .detail-scroll::-webkit-scrollbar { width: 10px; }
  .detail-scroll::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 6px; border: 3px solid var(--detail-pane); }
  .page-title { font-size: 16px; font-weight: 700; margin: 0; }
  /* 页头前进 / 后退：参考 macOS 系统设置窗口顶部的返回 / 前进按钮。
     始终占位，标题不会因可用性切换而跳动。高亮方式按系统截图与用户澄清：
     - 平时（无论可用 / 不可用）都没有底色；
     - 可用 = 图标加深（炭灰），鼠标悬停时才出现卡片色圆角底色块；
     - 不可用 = 图标浅灰、禁用，悬停无反馈。不是蓝色、不加描边阴影。 */
  .nav-btns { display: flex; align-items: center; gap: 4px; margin-right: 12px; }
  .navbtn {
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 7px;
    background: transparent; color: var(--text-3);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: default;
  }
  .navbtn svg { width: 15px; height: 15px; }
  .navbtn.enabled { color: var(--nav-icon-on); cursor: pointer; }
  .navbtn.enabled:hover { background: var(--card); }
  .navbtn:focus-visible { outline: 2px solid var(--nav-icon-on); outline-offset: 1px; }

  .cards { max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  /* 2026-11-17 尝试：卡头移到卡片之外。card-group 把「卡头 + 卡片」作为一组，
     .cards 的 gap 仍作用于组之间；卡头与卡片之间用较小的 gap。
     只有卡头、没有设置项（也无 Inset）的卡片不适用此规则，卡头留在卡片内。 */
  .card-group { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 16px 16px 6px;
  }
  /* 卡头在卡外、或整卡无卡头（headless）时，顶部不再为卡头留白；上下 padding 对称。 */
  .card-group .card, .card.card-headless { padding: 6px 16px; }
  /* 右栏卡片恒实色：降低透明度恒开，alpha 不参与，文字对比度始终可测。 */
  .card-head { display: flex; align-items: center; gap: 11px; padding-bottom: 14px; }
  /* 卡头在卡外：左右 padding 与卡片一致，使徽章 / 标题左缘与卡内行徽章对齐；去掉卡内时的下留白。 */
  .card-group .card-head { padding: 0 16px; }
  /* 卡头标题 14px / 600，与 Swift AidenteSectionHeader 14pt 对齐；设置项标签仍是 13px。 */
  .card-title { font-size: 14px; font-weight: 600; margin: 0; }
  .card-sub { font-size: 11.5px; color: var(--text-2); margin-top: 1px; }
  /* 副标题内链（卡头 / 行副标题）：只用系统文字色与副标题灰字区分，不加下划线 */
  .card-sub a, .r-sub a { color: var(--text); text-decoration: none; }
  .card-sub a:hover, .r-sub a:hover { opacity: .72; }
  .card-divider { height: 1px; background: var(--stroke); margin: 0 -16px 6px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; min-height: 30px;
  }
  .row .r-label { font-size: 13px; flex: 0 0 auto; }
  .row .r-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .row .r-main { flex: 1; min-width: 0; }
  .row .r-control { flex: 0 0 auto; display: flex; align-items: center; }
  .row-text { font-size: 12px; color: var(--text-2); line-height: 1.5; padding: 8px 0 11px; }

  .divider { height: 1px; background: var(--stroke); margin: 0 -16px; }

  /* Toggle */
  /* 开关两态都由 renderCard 传入的卡色决定：
     --toggle-on = 首色实底；--toggle-off = 首色 16% 半透明叠卡片背景 */
  .toggle {
    width: 38px; height: 22px; border-radius: 12px;
    background: var(--toggle-off, #c7c7cc); position: relative; cursor: pointer; transition: background .15s;
    flex: 0 0 38px;
  }
  .toggle.on { background: var(--toggle-on, #3d8ffa); }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .toggle.on::after { transform: translateX(16px); }

  /* Segmented */
  .segmented {
    display: inline-flex; background: var(--search-bg); border-radius: 7px; padding: 2px;
    gap: 2px;
  }
  .seg {
    font-size: 12px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    color: var(--text-2); white-space: nowrap;
  }
  .seg.on { background: var(--field); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Slider */
  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  .slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 3px;
    background: var(--stroke-strong); width: 180px; }
  .slider:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #0a84ff; outline-offset: 2px;
  }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; border: 1px solid var(--stroke-strong);
    box-shadow: 0 1px 2px rgba(0,0,0,.2); cursor: pointer; }
  /* 滑杆数值：13px 常规字重，与行标签同用系统文字色 var(--text)，不随卡色变化 */
  .slider-val { font-size: 13px; color: var(--text); width: 46px; text-align: right; }

  /* Button */
  .btn {
    font-size: 12.5px; padding: 5px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn svg { width: 13px; height: 13px; }
  a.btn { text-decoration: none; }
  .btn-ghost { background: var(--field); border-color: var(--stroke); color: var(--text); }

  /* 卡头菜单选择器（语言 / 外观）：单击弹出选项列表，与标题同行、不占卡片行 */
  .head-menu { position: relative; margin-left: auto; flex: 0 0 auto; }
  .head-menu-btn {
    font-size: 12.5px; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    background: var(--field); border: 1px solid var(--stroke); color: var(--text);
    display: inline-flex; align-items: center; gap: 4px;
    width: max-content; max-width: 240px;
  }
  .head-menu-btn:hover { background: var(--search-bg); }
  /* macOS 风格：当前值用系统文字色，双箭头紧跟在值右边；按钮宽度随内容自适应，不写死。 */
  .head-menu-btn .chev {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1px 4px; border-radius: 4px; background: var(--search-bg);
  }
  .head-menu-btn .chev svg { width: 11px; height: 11px; color: var(--text-2); }
  .head-menu-btn [data-menu-label] { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .head-menu-pop {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 30;
    /* 宽度随内容自适应：中文短则窄、英文长则宽；超长在 max-width 内省略号截断，不写死宽度。 */
    width: max-content; max-width: 240px; padding: 4px; border-radius: 8px;
    background: var(--field); border: 1px solid var(--stroke-strong);
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
  }
  [hidden] { display: none !important; }
  .head-menu-item {
    font-size: 12.5px; padding: 6px 9px; border-radius: 5px; cursor: pointer;
    display: flex; align-items: center; justify-content: flex-start; gap: 8px;
    color: var(--text);
  }
  /* 2026-11-17 对齐 Swift AidenteMenuPicker：悬停 = 系统强调色实底 + 白字白勾（macOS 原生菜单样式） */
  .head-menu-item:hover { background: var(--sel-bg); color: var(--sel-text); }
  .head-menu-item .check { flex: 0 0 13px; width: 13px; height: 13px; visibility: hidden; }
  .head-menu-item[aria-checked="true"] .check { visibility: visible; }
  .head-menu-item [data-menu-value] { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* Notice */
  .notice {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 9px;
    font-size: 11.5px; line-height: 1.45; margin: 6px 0 10px;
    background: var(--search-bg); color: var(--text-2);
  }
  /* 徽章与文字垂直居中；文字换行时由文字块撑高容器，上下等量向外延伸，徽章仍居中 */
  .notice > div { min-width: 0; }

  /* Inset panel */
  .inset {
    background: var(--search-bg); border-radius: 9px; padding: 12px 13px;
    margin: 6px 0 10px; font-size: 12px; color: var(--text-2); line-height: 1.6;
  }
  .inset.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  /* 快捷指令卡：等宽 URL + 灰色中文说明，逐行对齐 */
  .shortcut-line { display: flex; gap: 12px; align-items: baseline; }
  .shortcut-line code { flex: 0 0 210px; color: var(--text); }
  .shortcut-line span { font-family: system-ui; }

  /* 状态文案：卡内说明状态 / 注意事项的独立文字行（.notice） */

  /* 真实组件取色：AidenteIconBadge = 首色 16% 底 / 34% 描边 / 尾色图标 */

  .badge-slot { width: 26px; flex: 0 0 26px; display: flex; justify-content: flex-end; align-items: center; }

  .page-head { display: flex; align-items: center; }

  .spec { max-width: 980px; margin: 0 auto 28px; font-size: 11px;

    font-size: 12px; display: flex; align-items: baseline; gap: 8px; list-style: none; }

  .spec-card summary::after { content: "＋"; margin-left: auto; color: #b0b0b5; font-weight: 400; }
  .spec-card[open] summary::after { content: "－"; }
  .spec-card[open] summary { margin-bottom: 6px; }
  .spec-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 2px 0; }
  .spec-table th { text-align: left; color: #737378; font-weight: 600;
    padding: 3px 12px 3px 0; border-bottom: 1px solid rgba(0,0,0,.10); white-space: nowrap; }
  .spec-table td { padding: 4px 12px 4px 0; border-bottom: 1px dashed rgba(0,0,0,.07);

  .spec-table tr:last-child td { border-bottom: none; }
  .spec-table td.v { color: #1d1d1f; font-weight: 600; white-space: nowrap; }
  .spec-table code { font-size: 10.5px; }
  .spec-note { margin-top: 6px; }
  .spec-note b { color: #1d1d1f; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .sw { display: inline-flex; align-items: center; gap: 5px; }

  /* 添加计划任务弹窗 · 页下方静态预览（520×450 窗口 mockup，对齐 Swift .frame(width:520, height:450)） */

  .sheet-window {
    width: 520px; max-width: 100%; border-radius: 12px; overflow: hidden;

  }

  /* 弹窗状态流转说明（页下方预览区顶部） */
  /* 能量分流（对齐 srimanachanta/Stasis 的 PowerSankeyView 展示图）：
     单色流管 = 系统文字色 15%，节点 = 文字色 5% 底 / 20% 描边、外侧 16px 圆角，
     13px 中等字重 W 数值，不引入彩色，深浅色都跟随系统语义色。 */
  .sankey { position: relative; height: 120px; margin: 2px 0 4px; }

  .sankey .node {
    position: absolute; width: 60px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    color: var(--text-2); font-size: 11px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .sankey .node.left {
    left: 0;
    background: color-mix(in srgb, var(--node) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--node) 34%, transparent);
    color: var(--node);
    border-radius: 16px 0 0 16px;
  }
  .sankey .node.right {
    right: 0;
    background: color-mix(in srgb, var(--node) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--node) 34%, transparent);
    color: var(--node);
    border-radius: 0 16px 16px 0;
  }
  /* 节点三色对齐 Swift AidenteTheme：amber / jade / ocean；浅色用加深 ink */
  .sankey .node.amber { --node: #ff972e; }
  .sankey .node.jade  { --node: #2ed680; }
  .sankey .node.ocean { --node: #3d8ffa; }
  body:not(.dark) .sankey .node.amber { color: #c76604; }
  body:not(.dark) .sankey .node.jade  { color: #0d8547; }
  body:not(.dark) .sankey .node.ocean { color: #0f66cc; }
  .sankey .watt {
    /* 上下左右居中：left 50% + translateX(-50%)，垂直用 top + translateY(-50%) */
    position: absolute; left: 50%; transform: translate(-50%, -50%);
    color: var(--text); font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sankey .node svg { width: 16px; height: 16px; }
  .sankey .charging-battery { position: relative; width: 16px; height: 16px; }
  .sankey .charging-battery svg:last-child { position: absolute; width: 8px; height: 8px; left: 4px; top: 4px; }
  /* 移动高光：彩色渐变常驻为信息层，白色光带沿流管移动为动效层；
     尊重系统「减弱动态效果」——关闭动效时只保留彩色渐变。
     白色光带在浅色卡片上对比度低，亮色模式用 CSS 覆盖为更浓的透明度（暗色用渐变属性里的淡值）。 */
  body:not(.dark) .sankey .sheen-stop.glow-e1 { stop-opacity: .02; }
  body:not(.dark) .sankey .sheen-stop.glow-e2 { stop-opacity: .06; }
  body:not(.dark) .sankey .sheen-stop.glow-peak { stop-opacity: .144; }
  body:not(.dark) .sankey .sheen-stop.core-e { stop-opacity: .048; }
  body:not(.dark) .sankey .sheen-stop.core-peak { stop-opacity: .36; }
  @media (prefers-reduced-motion: reduce) {
    .sankey .sheen { display: none; }
  }
  .sankey .caption {
    position: absolute; top: -2px; left: 0; right: 0; text-align: center;
    color: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums;
  }
  .sheet-flow { max-width: 720px; margin-top: 20px; padding: 10px 12px;
    border-radius: 9px; background: var(--card); border: 1px solid var(--stroke);
    font-size: 11.5px; color: var(--text-2); line-height: 1.65; }
  .sheet-flow b { color: var(--text); font-weight: 600; }
</style>
</head>

const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
/* HSL 饱和度 × factor 等价于向同亮度灰 l 混合 (1-factor)；factor=1 原色。
   侧栏徽章用默认 1，详情区徽章用 BADGE_SATURATION = 0.9。 */
const badgeTint = (hex, factor) => {
  const n = parseInt(hex.slice(1), 16);
  const ch = [n >> 16 & 255, n >> 8 & 255, n & 255];
  const l = (Math.max(...ch) + Math.min(...ch)) / 2;
  return '#' + ch.map(v => Math.round(l + factor * (v - l)).toString(16).padStart(2, '0')).join('');
};
const grad = (k, factor = 1) => {
  const [a, b] = pal(k);
  return `linear-gradient(135deg, ${badgeTint(a, factor)}, ${badgeTint(b, factor)})`;
};

/* 侧栏导航徽章：渐变实底 + 白图标（SettingsView.sidebarRow，真实实现） */
function badge(k, colors) {
  return `<span class="nav-icon" style="background:${grad(colors)}">${svg(k)}</span>`;
}
/* 2026-11-11 规则：详情区徽章绘制对齐侧栏（135° 渐变实底 + 白图标，
   无半透明底 / 描边 / 阴影 / 尾色图标），但色对饱和度降到 90% 且恒定不随主题切换。
   导航栏 tab 徽章保持 100% 饱和。 */
const BADGE_SATURATION = 0.9;
function iconBadge(k, colors, size) {
  const ico = Math.round(size * 0.46);
  return `<span class="ib" style="width:${size}px;height:${size}px;`
    + `border-radius:${Math.max(6, Math.round(size * 0.27))}px;background:${grad(colors, BADGE_SATURATION)};`
    + `color:#fff;--ico:${ico}px">${svg(k)}</span>`;
}
/* 状态文案（AidenteIconBadge 式）徽章：首色 16% 底 / 34% 描边 / 尾色图标，
   半透明叠在卡片背景 var(--card) 上、跟随主题变化（不恒定），带外围框线；
   尺寸跟随 --tab-badge-size。用于「添加计划任务」弹窗任务设置卡的行徽章（用户 2026-11-11 定）。 */
function legacyBadge(k, colors, size = TAB_BADGE_SIZE) {
  const [a, b] = pal(colors);
  const ico = Math.round(size * 0.46);
  return `<span class="ib" style="width:${size}px;height:${size}px;`
    + `border-radius:${Math.max(6, Math.round(size * 0.27))}px;`
    + `background:${rgba(a, .16)};border:1px solid ${rgba(a, .34)};color:${b};--ico:${ico}px">`
    + `${svg(k)}</span>`;
}

       与 rBtn / rBtnRow / card.action 的动作按钮同款图标。 */
    const ico = c.icon ? svg(c.icon) : '';
    return `<span class="btn" style="background:${rgba(a, .20)};border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${ico}${c.label}</span>`;
  }
  return '';
}

/* 2026-11-11 设计规则：同一张卡片内颜色一致，不设强调色 / 状态色例外。
   卡头选定色对后，卡内行徽章、开关行、状态点、状态文案、动作按钮、数值一律继承；
   其中徽章为恒定实底，状态文案与动作按钮按半透明档位跟随主题变化。
   PAGES 里各控件原有的 colors 值保留作 6.1.3 基线追溯，渲染时统一覆盖。 */
function renderCard(card, legacyRows) {
  const rows = card.rows.map(r => {
    const row = { ...r, colors: card.colors };
    /* 第三项 href 保留：链接型动作按钮用 <a>，其余仍是静态 <span> */
    if (r.t === 'btnrow') row.list = r.list.map(([label, , href]) => [label, card.colors, href]);
    return row;
  });
  /* 2026-11-14 破例：card.action 把动作按钮放到卡头标题右侧，色对继承卡色，
     与卡内动作按钮同档（20% 底 / 34% 描边、文字系统色、随主题）。 */
  const [a] = pal(card.colors);
  /* 2026-11-14：软件更新 sheet 的卡片不设卡头——弹窗标题区已说明用途，
     「更新检查 / 更新进度」这行重复。headless 跳过徽章、标题、副标题与分隔线。 */
  const headless = !!card.headless;
  /* 2026-11-17 用户规则：卡头徽章尺寸与设置项行徽章一致（26），标题字号与设置项标签一致（13px）；
     卡片含 Inset 或含设置项（带 .r-label 的 toggle / control 行）时不渲染卡头徽章（卡头只剩标题），
     两者都没有时才保留徽章。headOutside 让无设置项的卡（如「法律与开源」）也可显式外置卡头并去徽章。 */
  const hasInset = card.rows.some(r => r.t === 'inset');
  /* menuro（行内菜单，如「语言 / 外观 / 菜单栏实时读数」）也是设置项，纳入判定；
     漏判会让含设置项的卡退化成「卡头在卡内当第一项」（2026-11-18 用户指出）。 */
  const hasSettingRow = card.rows.some(
    r => r.t === 'toggle' || r.t === 'control' || r.t === 'menuro');
  /* headless 卡（如睡眠页，整页只一张卡、无卡头）不进 card-group，直接渲染纯卡片。 */
  const headOutside = !headless && (hasInset || hasSettingRow || !!card.headOutside);
  const headBadge = headOutside ? '' : iconBadge(card.icon, card.colors, 26);
  const headAction = !headless && card.action
    ? `<span class="btn" style="margin-left:auto;flex:0 0 auto;background:${rgba(a, .20)};`
      + `border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${svg('bolt')}${card.action}</span>`
    : '';
  /* 卡头菜单选择器（语言 / 外观）：单击按钮弹出选项列表，与标题同行、不占卡片行。 */
  const headMenu = !headless && card.headMenu ? menuHTML(card.headMenu.opts, card.headMenu.sel) : '';
  /* 2026-11-17 规则：含设置项（或 Inset）的卡片卡头移到卡片之外（card-group：卡头 + 卡片）；
     只有卡头、没有设置项的卡片不适用——卡头留在卡片内，保留卡头下方的 card-divider；
     例外：显式标记 headOutside 的卡（如「法律与开源」）也外置卡头。卡头在卡内时带分隔线，在卡外时不带。 */
  const headerBlock = headless ? '' : `<div class="card-head">
      ${headBadge}
      <div style="flex:1;min-width:0"><h2 class="card-title">${card.title}</h2>${card.sub ? `<div class="card-sub">${card.sub}</div>` : ''}</div>
      ${headAction}
      ${headMenu}
    </div>`;
  const contentRows = rows.map(r => renderRow(r, legacyRows)).join('');
  if (headOutside) {
    return `<div class="card-group">${headerBlock}<div class="card">${contentRows}</div></div>`;
  }
  /* headless 卡无卡头，不该输出卡头下方的横线（否则首个开关上方残留一条 divider）。 */
  const header = headerBlock + (!headless && rows.length ? '<div class="card-divider"></div>' : '');
  return `<div class="card${headless ? ' card-headless' : ''}">${header}${contentRows}</div>`;
}

/* 弹窗（sheet）静态预览：标题区 + 卡片 + 底部动作按钮。
   弹窗标题徽章 26（2026-11-17 由 34 → 28 → 26，现与卡片 / 设置项徽章统一）属卡外元素；标题字号 15px（原 17px，比卡片标题 13px 略高半档）。
   「添加计划任务」沿用 legacy 行徽章；「软件更新」用 constant 实底徽章（legacyRows:false）。
   label / actions 可选；不传时保持「添加计划任务」弹窗的原样。 */
function renderSheet(sheet) {
  const [a] = pal(sheet.colors);
  const actions = sheet.actions || [
    { label:'取消', ghost:true },
    { label:'添加任务' },
  ];
  const buttons = actions.map(act => act.ghost
    ? `<span class="btn btn-ghost" role="button" tabindex="0">${act.label}</span>`
    : `<span class="btn" style="background:${rgba(a, .20)};border-color:${rgba(a, .34)};color:var(--text)" role="button" tabindex="0">${act.label}</span>`
  ).join('');
  return `<div class="sheet-window"><div class="sheet-bg">`
    + `<div class="sheet-title">${iconBadge(sheet.icon, sheet.colors, 26)}`
    + `<div><h2 class="sheet-title-t">${sheet.title}</h2>`
    + `${sheet.sub ? `<div class="sheet-title-s">${sheet.sub}</div>` : ''}</div></div>`
    + renderCard(sheet.card, sheet.legacyRows !== false)
    + `<div class="sheet-actions">${buttons}</div></div></div>`;
}

/* 一个页可预览多个弹窗状态（软件更新的检查 / 结果 / 进度 / 完成 / 失败）；
   单对象仍是「添加计划任务」。flow 是可选的状态流转说明，放在最前。 */
function renderSheetPreviews(sheets, flow) {
  const list = Array.isArray(sheets) ? sheets : [sheets];
  const flowBlock = flow ? `<div class="sheet-flow"><b>弹窗状态流转</b><br>${flow}</div>` : '';
  return flowBlock + list.map(s => `<div class="sheet-wrap"><div class="sheet-label">${
    s.label || '添加计划任务弹窗（点「添加计划任务」后弹出 · 520×450）'
  }</div>${renderSheet(s)}</div>`).join('');
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map((t, i) => {
    return `<div class="nav-item ${i===0?'active':''}" role="tab" tabindex="0" aria-selected="${i===0}" data-tab="${t.id}">${badge(t.icon, t.colors)}<span>${t.title}</span></div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => selectTab(el.dataset.tab));
  });
}

/* tab 浏览历史栈：参考 macOS 系统设置窗口顶部的返回 / 前进按钮。
   - history 是当前可回退的路径，idx 指向当前项。
   - 点左栏导航 = 一次新的前进：截断 idx 之后的分支，push 新 tab。
   - 点后退 / 前进只移动 idx，不写历史。
   - 每次打开窗口历史重置为 [general]（见下方注释），两个按钮都不可用。 */
let navHistory = ['general'];
let navIndex = 0;
let currentTab = 'general';

function navigateTo(id, record) {
  if (record) {
    if (navHistory[navIndex] !== id) {
      navHistory = navHistory.slice(0, navIndex + 1);
      navHistory.push(id);
      navIndex = navHistory.length - 1;
    }
  } else {
    navIndex = id; // 后退/前进：id 即目标下标
  }
  currentTab = navHistory[navIndex];
  renderSettings();
}

function selectTab(id) { navigateTo(id, true); }
function goBack()    { if (navIndex > 0) navigateTo(navIndex - 1, false); }
function goForward() { if (navIndex < navHistory.length - 1) navigateTo(navIndex + 1, false); }

function renderSettings() {
  document.querySelectorAll('.nav-item').forEach(el => {
    const on = el.dataset.tab === currentTab;
    el.classList.toggle('active', on);
    el.setAttribute('aria-selected', String(on));
  });
  const page = PAGES[currentTab];
  const tab = TABS.find(t => t.id === currentTab);
  const canBack = navIndex > 0;
  const canForward = navIndex < navHistory.length - 1;
  const backTab = canBack ? TABS.find(t => t.id === navHistory[navIndex - 1]) : null;
  const fwdTab = canForward ? TABS.find(t => t.id === navHistory[navIndex + 1]) : null;
  const detail = document.getElementById('detail');
  detail.innerHTML = `<div class="detail-head"><div class="page-head">`
    + `<div class="nav-btns">`
      + `<button class="navbtn ${canBack ? 'enabled' : ''}" id="navBack" aria-label="后退" title="${canBack ? '后退：' + backTab.title : '无后退历史'}" ${canBack ? '' : 'disabled'}>${svg('chevron.left')}</button>`
      + `<button class="navbtn ${canForward ? 'enabled' : ''}" id="navForward" aria-label="前进" title="${canForward ? '前进：' + fwdTab.title : '无前进历史'}" ${canForward ? '' : 'disabled'}>${svg('chevron.right')}</button>`
    + `</div>`
    + `<h1 class="page-title">${tab.title}</h1></div>`
    + `<div class="hdiv"></div></div>`
    + `<div class="detail-scroll"><div class="cards">${page.cards.map(c => renderCard(c, false)).join('')}</div>`
    + (page.sheet ? renderSheetPreviews(page.sheet, page.sheetFlow) : '')
    + `</div>`;
  document.getElementById('navBack').addEventListener('click', goBack);
  document.getElementById('navForward').addEventListener('click', goForward);
  bindInteractions();
}

function bindInteractions() {
  // 非原生控件统一支持 Enter / Space 激活
  document.querySelectorAll('[tabindex]:not(input):not(button)').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  });
  // toggles
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('on');
      el.setAttribute('aria-checked', String(el.classList.contains('on')));
    });
  });
  // segmented
  document.querySelectorAll('.segmented').forEach(group => {
    group.querySelectorAll('[data-seg]').forEach(seg => {
      seg.addEventListener('click', () => {
        group.querySelectorAll('[data-seg]').forEach(s => {
          s.classList.remove('on'); s.setAttribute('aria-checked', 'false');
        });
        seg.classList.add('on'); seg.setAttribute('aria-checked', 'true');
      });
    });
  });
  // 卡头菜单选择器（语言 / 外观）：单击按钮展开选项列表，选中后更新按钮标签与勾选
  document.querySelectorAll('[data-head-menu]').forEach(menu => {
    const btn = menu.querySelector('[data-menu-btn]');
    const pop = menu.querySelector('.head-menu-pop');
    const label = menu.querySelector('[data-menu-label]');
    const close = () => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = pop.hidden;
      document.querySelectorAll('[data-head-menu]').forEach(m => {
        m.querySelector('.head-menu-pop').hidden = true;
        m.querySelector('[data-menu-btn]').setAttribute('aria-expanded', 'false');
      });
      if (willOpen) { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
    });
    menu.querySelectorAll('[data-menu-item]').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        menu.querySelectorAll('[data-menu-item]').forEach(i => i.setAttribute('aria-checked', 'false'));
        item.setAttribute('aria-checked', 'true');
        label.textContent = item.querySelector('[data-menu-value]').textContent;
        close();
      });
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('[data-head-menu]').forEach(m => {
      m.querySelector('.head-menu-pop').hidden = true;
      m.querySelector('[data-menu-btn]').setAttribute('aria-expanded', 'false');
    });
  });
  // sliders value label
  document.querySelectorAll('.slider').forEach(s => {
    s.addEventListener('input', () => {
      const v = s.parentElement.querySelector('.slider-val');
      if (v) v.textContent = s.value + (v.textContent.replace(/[0-9]/g,''));
    });
  });
}

themeBtn.setAttribute('aria-pressed', String(document.body.classList.contains('dark')));
themeBtn.addEventListener('click', () => {
  const dark = document.body.classList.toggle('dark');

/* ---------- 设置页玻璃化原型控制（只在原型里对照，不参与 App 实现） ---------- */
(function () {
  const body = document.body;
  const modeBtn = document.getElementById('modeBtn');
  const wallBtn = document.getElementById('wallBtn');
  body.dataset.glass = 'on';
  body.dataset.desktop = 'color';

  // 实色/玻璃只切左栏侧栏；右栏恒实色，不受此处影响
  modeBtn.addEventListener('click', () => {
    const on = body.dataset.glass !== 'on';
    body.dataset.glass = on ? 'on' : 'off';
    modeBtn.classList.toggle('on', on);
  });
  wallBtn.addEventListener('click', () => {
    const plain = body.dataset.desktop !== 'plain';
    body.dataset.desktop = plain ? 'plain' : 'color';
    wallBtn.classList.toggle('on', !plain);
  });
  modeBtn.classList.add('on');
})();

/* ---------- 规格说明（分层 spec 面板） ----------
   分层顺序参考设计系统文档通行做法：Foundations（尺寸 / 字号 / 配色）
   → 结构与组件 → 术语表；自上而下按依赖顺序，每层只引用上层概念。
   数值即设计基准：原型 CSS 与 Swift 源码都以此为准。 */
function renderLegend() {
  /* 色板：直接遍历 TABS，色块顺序、取色、标签与导航栏 tab 一一对应。
     tab 与色对是交叉的（仪表盘用 chargingColors 绿、充电管理用
     dashboardColors 紫），由 TABS 自身表达，末尾补高温保护字面量色对。 */
  const legendPairs = [
    ...TABS.map(t => [t.colors, t.title]),
    ['heat', '高温保护（字面量）'],
  ];
  const sw = legendPairs.map(([k, label]) =>
    `<span class="sw"><i style="background:linear-gradient(135deg,${pal(k)[0]},${pal(k)[1]})"></i>${label}</span>`
  ).join('');

  /* 轻量 helper：一行 spec 卡（title 中文 + en 英文 + open 默认态 + body HTML） */
  const card = (no, title, en, body, open = false) =>
    `<details class="spec-card"${open ? ' open' : ''}>`
    + `<summary><span class="no">${no}</span>${title}<span class="en">${en}</span></summary>`
    + body + `</details>`;

  const rows = (head, list, boldCols = [0, 1]) =>
    `<table class="spec-table"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>`
    + list.map(r => `<tr>${r.map((c, i) => `<td${boldCols.includes(i) ? ' class="v"' : ''}>${c}</td>`).join('')}</tr>`).join('')
    + `</table>`;

  const html =
    `<h2 class="spec-title">设置页设计规格 · Settings Design Spec</h2>`
    + `<p class="spec-sub">分层顺序：外框尺寸 → 窗口框架 → 页面设计 → 组件元素 → 字号 → 配色 → 术语；数值为设计基准，原型与 Swift 源码共同以此为准。</p>`

    /* 01 外框尺寸 */
    + card('01', '外框尺寸', 'Window', rows(['项', '值', '说明'], [
      ['窗口总宽', '750px', '锁死不可横向拉伸（minSize / maxSize 同宽钳制）'],
      ['窗口高度', '475px 默认 · 960px 上限', '纵向可拉伸'],
      ['左栏（导航栏）', '214px', '固定宽度，玻璃材质'],
      ['分隔线', '1px', '竖线从窗口顶贯通到底，不透明窗口底 + 中性描边'],
      ['右栏（编辑栏）', '535px', '自适应 = 750 − 214 − 1，实色恒定'],
    ]), true)

    /* 02 窗口框架 */
    + card('02', '窗口框架', 'Chrome',
      `<div class="spec-note">无横贯标题栏；交通灯浮在侧栏左上角，<b>中心距顶 30pt、最左缘 20pt</b>——用透明 <code>NSTitlebarAccessoryViewController</code> 撑高 titlebar 使按钮留在热区，AppKit 在改标题 / resize / 切事件会重排拉回默认位置，需在对应时机反复重贴。主徽章 <code>34px</code> +「Aidente」<code>18pt</code> bold，中心线在交通灯中心下方 <code>47pt</code>（y=77）；导航区与主徽章解耦、自然排在头部之后。<b>深色模式窗口光圈</b>：1pt 白 <code>20%</code> 描边贴合 12pt 圆角（Swift 用 <code>strokeBorder</code> 画在裁切内侧），浅色无光圈。</div>`
      + `<div class="spec-note"><b>前进 / 后退按钮</b>（页头左侧，参考系统设置）：平时无底色、可用 = 图标加深（浅色炭灰 <code>#535353</code>），悬停才出现 <code>var(--card)</code> 圆角底，不可用 = 浅灰禁用且无悬停反馈；两按钮始终占位，标题不跳动。历史栈每次开窗重置为「通用」。</div>`
      + `<div class="spec-note"><b>类液态玻璃</b>：右栏恒实色不采样玻璃；左栏玻璃四层 = chrome 底 + 实时玻璃 + side-fill 染色（浅 <code>rgba(236,236,238,.60)</code> / 深 <code>rgba(52,52,56,.50)</code>）+ glassTint（浅 <code>clear</code> / 深 <code>rgb(30,30,34) .24</code>）。左栏文字用系统色、徽章实底渐变，玻璃下可读。</div>`)

    /* 03 页面设计 */
    + card('03', '页面设计', 'Page', rows(['项', '值', '说明'], [
      ['页头', '高 60px · 不滚动', '实色遮挡下方卡片，整块可拖动窗口'],
      ['页标题', '16pt bold', '纯标题无徽章 / 副标题；文字中心距窗口顶 30px'],
      ['页头横线', '距标题中心 30px', '1px 分隔线固定不滚动'],
      ['滚动区', 'padding 18px 30px 40px', '只有卡片与弹窗预览滚动'],
      ['卡片间距', '16px', '卡片（组）之间的纵向 gap'],
      ['卡组内间距', '8px', '外置卡头与卡片本体的 gap'],
    ]), true)

    /* 04 组件元素 */
    + card('04', '组件元素', 'Components', rows(['元素', '规格', '说明'], [
      ['卡片', 'padding 6px 16px', '首末行距卡边约 15px，由行 padding 11px 补足'],
      ['卡头结构', '外置 / 内嵌 / headless', '含 Inset、设置项或 headOutside → 外置（只留标题无徽章无分隔线）；只有卡头无设置项 → 内嵌（保留徽章 + 分隔线）；headless → 完全无卡头'],
      ['徽章尺寸', '34 / 26 / 22', '34 = 左栏主徽章；26 = 卡头、设置项 / Inset 行、弹窗标题区；22 = 导航 tab、状态文案、sheet 行徽章（唯一来源 <code>--tab-badge-size</code>）'],
      ['徽章绘制', '135° 渐变实底 + 白图标', '恒定不随主题；tab 饱和 100%、详情区 90%（<code>badgeTint</code>）'],
      ['开关', '开 = 首色实底 · 关 = 首色 16%', '两态都随卡色，不用系统灰 / 蓝'],
      ['菜单选择器', '文字 + 右侧上下双箭头', '宽度随内容自适应；弹层对号在左、文字系统色；悬停 = 系统强调色圆角底白字（对齐 macOS）'],
      ['状态文案', '首色 7.5% 底 / 20% 描边', '随主题；徽章与文字垂直居中，换行上下等量延伸'],
      ['状态点', '8px 圆点', '位于状态文案左侧'],
      ['动作按钮', '首色 20% 底 / 34% 描边', '随主题；含所有按钮与按钮组'],
      ['Inset', '卡内嵌板', '间距统一交给卡片 VStack spacing，不单独加 margin'],
      ['弹窗', '宽 520 · 任务弹窗 520×450', '标题区 = 26 徽章 + 15pt 标题、无副标题；底部按钮右对齐'],
    ]), true)

    /* 05 字号 */
    + card('05', '字号', 'Type scale', rows(['字号', '用途', '备注'], [
